spring:
  application:
    name: payment-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 4000
            readTimeout: 4000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      client-id: payment-service-producer

    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*" #Accept deserialize every objects (DTO)

server:
  port: ${PAYMENT_SERVICE_PORT}
  error:
    include-message: always
    include-binding-errors: always

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}



springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false

openapi:
  service:
    url: ${OPENAPI_SERVICE_URL}

zalo-pay:
  app-id: ${ZALOPAY_APP_ID}
  key1: ${ZALOPAY_KEY_1}
  key2: ${ZALOPAY_KEY_2}
  create-order-endpoint: ${ZALOPAY_CREATE_ORDER_ENDPOINT}
  query-endpoint: ${ZALOPAY_QUERY_ENDPOINT}
  callback-url: ${ZALOPAY_CALLBACK_URL}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true